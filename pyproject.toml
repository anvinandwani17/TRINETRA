[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trinetra"
version = "0.1.0"
description = "Multimodal flood analysis hackathon project — initial scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
discovery = ["shapely>=2.1,<3", "pyproj>=3.7,<4"]
download = ["rasterio>=1.4,<2"]
s3 = ["boto3>=1.35,<2"]
preprocess = ["numpy>=2,<3", "rasterio>=1.4,<2", "shapely>=2.1,<3", "pyproj>=3.7,<4", "matplotlib>=3.9,<4"]
baseline = ["numpy>=2,<3", "rasterio>=1.4,<2", "scipy>=1.14,<2", "matplotlib>=3.9,<4"]
geo = [
    "numpy>=2,<3",
    "rasterio>=1.4,<2",
    "geopandas>=1.1,<2",
    "shapely>=2.1,<3",
    "pyproj>=3.7,<4",
    "pyogrio>=0.11,<1",
]
# Install from the CPU index with requirements-ml-cpu.txt on Anvi's laptop.
ml = ["torch>=2.6,<3"]

[project.scripts]
trinetra-discover-s1 = "trinetra.discovery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
